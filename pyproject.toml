[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather_exporter"
version = "0.1.0"
description = "Prometheus exporter for weather forecasts fronted by weather-service"
readme = "README.md"
requires-python = ">=3.14"
license = {file = "LICENSE"}
authors = []
dependencies = [
    "metrics-utility @ git+https://github.com/jewzaam/metrics-utility.git@v0.1.1",
    "pyyaml",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
]

[tool.black]
target-version = ["py314"]

[tool.setuptools.packages.find]
where = ["."]
include = ["weather_exporter*"]
